services:
  # ── Reverse Proxy ──
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@agenthub.io"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - agenthub

  # ── Control Plane (TypeScript / NestJS) ──
  control-plane:
    build:
      context: ../ts-control-plane
      dockerfile: ../docker/Dockerfile.control-plane
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.cp.rule=PathPrefix(`/api`,`/graphql`,`/ws`)'
      - "traefik.http.services.cp.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SEED_DEV_ACCOUNTS=${SEED_DEV_ACCOUNTS:-true}
      - AGENTHUB_DEV_PASSWORD=${AGENTHUB_DEV_PASSWORD:-AgentHub123!}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://agenthub:agenthub@postgres:5432/agenthub_cp
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - RUNTIME_PROVIDER=docker
      - DATA_PLANE_HTTP_URL=http://data-plane:8080
      - WORKSPACE_STORAGE_PROVIDER=minio
      - WORKSPACE_S3_ENDPOINT=http://minio:9000
      - WORKSPACE_S3_BUCKET=agenthub-workspaces
      - WORKSPACE_S3_REGION=us-east-1
      - WORKSPACE_S3_ACCESS_KEY=${MINIO_ROOT_USER:-agenthub}
      - WORKSPACE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-agenthub-secret}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - agenthub

  # ── Data Plane (Go / Gin + gRPC) ──
  data-plane:
    build:
      context: ../go-data-plane
      dockerfile: deployments/Dockerfile
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.dp.rule=PathPrefix(`/dp`)'
      - "traefik.http.services.dp.loadbalancer.server.port=8080"
    environment:
      - GRPC_ADDR=:50051
      - HTTP_ADDR=:8080
      - DOCKER_HOST=unix:///var/run/docker.sock
      - RUNTIME_DOCKER_NETWORK=${RUNTIME_DOCKER_NETWORK:-agenthub_local}
      - HERMES_IMAGE=${HERMES_IMAGE:-agenthub/hermes-base:latest}
      - CP_API_URL=http://control-plane:3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - WORKSPACE_STORAGE_PROVIDER=minio
      - WORKSPACE_S3_ENDPOINT=http://minio:9000
      - WORKSPACE_S3_BUCKET=agenthub-workspaces
      - WORKSPACE_S3_REGION=us-east-1
      - WORKSPACE_S3_ACCESS_KEY=${MINIO_ROOT_USER:-agenthub}
      - WORKSPACE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-agenthub-secret}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - control-plane
      - minio
    ports:
      - "8081:8080"
      - "50051:50051"
    networks:
      - agenthub

  # ── Hermes Runtime Image Builder (build-only profile) ──
  hermes-base:
    profiles:
      - build
    build:
      context: .
      dockerfile: Dockerfile.hermes-base
    image: agenthub/hermes-base:latest
    command: ["python", "/app/agent_server.py"]

  # ── Local S3-compatible Workspace Storage ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agenthub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agenthub-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - agenthub

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-agenthub} ${MINIO_ROOT_PASSWORD:-agenthub-secret}; do sleep 2; done;
      mc mb --ignore-existing local/agenthub-workspaces;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agenthub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agenthub-secret}
    networks:
      - agenthub

  # ── Frontend (React / Vite) ──
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.web.rule=Host(`app.agenthub.localhost`)'
      - "traefik.http.services.web.loadbalancer.server.port=80"
    ports:
      - "5173:80"
    depends_on:
      - control-plane
    networks:
      - agenthub

  # ── PostgreSQL (Shared, logical isolation via DB name) ──
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub_cp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agenthub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub_cp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Shared, DB index isolation) ──
  redis:
    image: redis:7-alpine
    networks:
      - agenthub
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Monitoring ──
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - agenthub

  grafana:
    image: grafana/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - agenthub

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  minio_data:

networks:
  agenthub:
    name: agenthub_local
    driver: bridge
